<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Git Simulator</title>
<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel-2:#eef1f3;
  --border:#dde3e8;
  --text:#2b3e50;
  --text-dim:#6b7785;
  --accent:#df691a;
  --green:#2b3e50;
  --red:#a8452f;
  --yellow:#ed961a;
  --purple:#2b3e50;
  --orange:#ed961a;
  --term-dim:#8b98a5;
  --term-purple:#bc8cff;
  --term-red:#f85149;
  --term-green:#2f9e47;
  --term-yellow:#b7791f;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html{ font-size:18px; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  padding:28px 24px 50px;
}
.wrap{max-width:1320px;margin:0 auto;}

.page-layout{
  display:flex;
  gap:0;
  align-items:stretch;
}
#app{ flex:1 1 auto; min-width:0; padding-right:14px; }
.terminal-sidebar{ flex:0 0 auto; width:340px; min-width:240px; max-width:640px; }
.resizer{
  flex:0 0 auto;
  width:10px;
  margin:0 4px;
  cursor:col-resize;
  position:relative;
  background:transparent;
}
.resizer::after{
  content:"";
  position:absolute;
  top:0; bottom:0; left:4px;
  width:2px;
  background:var(--border);
  border-radius:2px;
}
.resizer:hover::after, .resizer.active::after{ background:var(--accent); }
@media (max-width:940px){
  .page-layout{flex-direction:column; gap:14px;}
  #app{padding-right:0;}
  .resizer{display:none;}
  .terminal-sidebar{position:static !important; height:auto !important; width:100% !important; max-width:none;}
  .terminal{max-height:260px !important;}
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:18px;
  gap:16px;
}
h1{
  font-size:1.2rem;
  margin:0 0 2px;
  color:#2b3e50;
}
header p{margin:0;color:var(--text-dim);font-size:0.85rem;max-width:52ch;line-height:1.4;}
.reset-link{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:0.78rem;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
}
.reset-link:hover{color:var(--text);border-color:var(--text-dim);}

/* clone screen */
.clone-screen{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:8px;
  padding:40px 24px;
  text-align:center;
}
.clone-screen p{color:var(--text-dim);margin:0 0 18px;font-size:0.9rem;}
.repo-url{
  font-family:var(--mono);
  font-size:0.85rem;
  color:var(--accent);
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 12px;
  display:inline-block;
  margin-bottom:20px;
}

button{
  font-family:inherit;
  font-size:0.92rem;
  font-weight:600;
  padding:12px 20px;
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  border-radius:7px;
  cursor:pointer;
  position:relative;
}
button:hover{border-color:var(--text-dim);}
button.primary{background:var(--accent);border-color:var(--accent);color:#ffffff;}
button.primary:hover{filter:brightness(1.08);}
button.danger{background:transparent;border-color:var(--red);color:var(--red);}
button.ghost{background:transparent;}

/* hover tooltips */
button[data-tip].tip-below::after{
  bottom:auto;
  top:calc(100% + 9px);
  transform:translateX(-50%) translateY(-4px);
}
button[data-tip].tip-below:hover::after, button[data-tip].tip-below:focus-visible::after{
  transform:translateX(-50%) translateY(0);
}
button[data-tip].tip-below::before{
  bottom:auto;
  top:calc(100% + 3px);
  border-top-color:transparent;
  border-bottom-color:#1c2129;
}

button[data-tip].tip-narrow::after{
  width:150px;
  font-size:0.72rem;
  padding:8px 9px;
}

button[data-tip]::after{
  content: attr(data-tip);
  position:absolute;
  bottom:calc(100% + 9px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  background:#1c2129;
  color:#e6edf3;
  border:1px solid var(--border);
  padding:9px 11px;
  border-radius:7px;
  font-size:0.76rem;
  font-weight:400;
  line-height:1.4;
  white-space:normal;
  width:200px;
  text-align:left;
  box-shadow:0 10px 24px rgba(0,0,0,0.5);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .12s ease, transform .12s ease;
  z-index:200;
}
button[data-tip]::before{
  content:"";
  position:absolute;
  bottom:calc(100% + 3px);
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:#1c2129;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .12s ease;
  z-index:200;
}
button[data-tip]:hover::after, button[data-tip]:focus-visible::after{
  opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);
}
button[data-tip]:hover::before, button[data-tip]:focus-visible::before{
  opacity:1; visibility:visible;
}

/* status bar */
.status-bar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 14px;
  margin-bottom:14px;
  font-size:0.85rem;
}
.branch-chip{
  font-family:var(--mono);
  background:var(--panel-2);
  border:1px solid var(--border);
  padding:3px 9px;
  border-radius:14px;
  font-size:0.78rem;
}
.badge{
  font-size:0.72rem;
  font-weight:600;
  padding:3px 9px;
  border-radius:14px;
}
.badge.clean{background:rgba(43,62,80,0.10);color:var(--text);}
.badge.modified{background:rgba(223,105,26,0.16);color:var(--text);}
.badge.staged{background:rgba(223,105,26,0.16);color:var(--text);}
.badge.partial{background:linear-gradient(90deg, rgba(223,105,26,0.16) 50%, rgba(43,62,80,0.10) 50%);color:var(--text);}
.badge.conflict{background:rgba(168,69,47,0.16);color:#7a3223;}
.sync-note{color:var(--text-dim);font-size:0.78rem;margin-left:auto;}

/* two-panel layout */
.repo-grid{
  display:grid;
  grid-template-columns:1fr 130px 1fr;
  gap:0;
  align-items:stretch;
  margin-bottom:22px;
}
@media (max-width:760px){
  .repo-grid{grid-template-columns:1fr; gap:16px;}
  .sync-bar{flex-direction:row !important; justify-content:center;}
  .sync-bar-inner{position:static; flex-direction:row;}
}
.side-panel{
  border-radius:12px;
  padding:22px;
  min-width:0;
  position:relative;
  display:flex;
  flex-direction:column;
}
.side-panel.local{
  border:1.5px solid var(--accent);
  background:rgba(223,105,26,0.05);
}
.side-panel.remote{
  border:1.5px solid var(--purple);
  background:rgba(43,62,80,0.05);
}
.side-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.side-icon{
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  font-size:0.9rem;
  flex-shrink:0;
}
.side-panel.local .side-icon{background:rgba(223,105,26,0.18);color:var(--accent);}
.side-panel.remote .side-icon{background:rgba(43,62,80,0.18);color:var(--purple);}
.side-title{font-weight:700;font-size:0.92rem;color:#2b3e50;}
.side-sub{font-size:0.72rem;color:var(--text-dim);}

.sync-bar{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 4px;
  min-height:200px;
}
.sync-bar-inner{
  position:sticky;
  top:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.sync-bar button{width:100%;font-size:0.78rem;padding:9px 6px;}
.sync-arrow{font-size:1.1rem;color:var(--text-dim);}

.remote-file{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:12px;
  font-family:var(--mono);
  font-size:0.8rem;
  color:var(--text-dim);
  white-space:pre-wrap;
  min-height:140px;
  margin-bottom:10px;
}
.remote-empty{
  color:var(--text-dim);
  font-size:0.82rem;
  font-style:italic;
  padding:20px 4px;
  text-align:center;
}
.remote-branches{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
  font-size:0.78rem;
}
.remote-branch-row{
  display:flex;
  justify-content:space-between;
  font-family:var(--mono);
  color:var(--text-dim);
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:5px 9px;
  cursor:pointer;
}
.remote-branch-row:hover{ border-color:var(--text-dim); }
.remote-branch-row.viewing{
  border-color:var(--accent);
  background:rgba(223,105,26,0.14);
  box-shadow:0 0 0 2px var(--accent);
}
.remote-branch-row .viewing-tag{
  color:var(--accent);
  font-weight:700;
  font-size:0.72rem;
  margin-left:6px;
}
.remote-branch-row.current{
  color:#2b3e50;
  background:rgba(43,62,80,0.14);
  border-color:var(--purple);
}
.remote-branch-row .current-tag{
  color:var(--purple);
  font-weight:600;
  font-size:0.72rem;
  margin-left:6px;
}
.remote-branch-row .hash{color:var(--purple);}

.pr-section{
  border:1.5px solid var(--purple);
  border-left:5px solid var(--purple);
  background:rgba(43,62,80,0.05);
  border-radius:9px;
  padding:12px 14px;
  margin-bottom:12px;
}
.pr-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:none;
  border:none;
  box-shadow:none;
  padding:0;
  width:100%;
  text-align:left;
  cursor:pointer;
}
.pr-toggle-title{
  font-weight:700;
  font-size:0.92rem;
  color:var(--purple);
  display:flex;
  align-items:center;
  gap:7px;
}
.pr-toggle-hint{
  font-size:0.75rem;
  color:var(--text-dim);
  font-weight:500;
  margin-top:2px;
}
.pr-chevron{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px; height:24px;
  border-radius:50%;
  background:rgba(43,62,80,0.14);
  color:var(--purple);
  font-size:0.78rem;
  font-weight:700;
  transition:transform .15s ease;
  flex-shrink:0;
}
.pr-chevron.open{ transform:rotate(90deg); }
.pr-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.pr-card{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px 10px;
}
.pr-card.merged{border-color:rgba(43,62,80,0.4);}
.pr-card.closed{opacity:0.55;}
.pr-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:6px;
}
.pr-title{
  font-family:var(--mono);
  font-size:0.82rem;
  color:#2b3e50;
}
.pr-status{
  font-size:0.68rem;
  font-weight:700;
  padding:2px 8px;
  border-radius:10px;
  white-space:nowrap;
}
.pr-status.open{background:rgba(43,62,80,0.10);color:var(--text);}
.pr-status.merged{background:rgba(43,62,80,0.18);color:var(--purple);}
.pr-status.closed{background:rgba(92,107,120,0.18);color:var(--text-dim);}
.pr-actions{display:flex;gap:6px;}
.pr-actions button{font-size:0.74rem;padding:6px 10px;}
.pr-note{font-size:0.72rem;color:var(--text-dim);margin-top:4px;}
.pr-empty{font-size:0.78rem;color:var(--text-dim);font-style:italic;margin-bottom:10px;}

.teammate-btn{
  width:100%;
  font-size:0.82rem;
  font-weight:600;
  color:var(--purple);
  background:rgba(43,62,80,0.1);
  border:1.5px solid var(--purple);
  margin-bottom:12px;
}
.teammate-btn:hover{ background:rgba(43,62,80,0.18); }

.conflict-banner{
  background:rgba(168,69,47,0.1);
  border:1.5px solid var(--red);
  border-radius:8px;
  padding:10px 14px;
  margin-bottom:10px;
  font-size:0.82rem;
  color:#7a2e22;
}
.conflict-banner-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.resolve-check{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed rgba(168,69,47,0.35);
  font-size:0.84rem;
  color:#7a2e22;
  cursor:pointer;
}
.resolve-check input{width:16px;height:16px;accent-color:var(--red);cursor:pointer;}
.conflict-banner button{
  border-color:var(--red);
  color:var(--red);
  background:transparent;
  white-space:nowrap;
}
.conflict-banner button:hover{ background:rgba(168,69,47,0.12); }

/* editor */
.editor-panel{
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:14px;
  background:var(--panel);
}
.editor-tab{
  padding:8px 14px;
  font-family:var(--mono);
  font-size:0.8rem;
  color:var(--text-dim);
  border-bottom:1px solid var(--border);
  background:var(--panel-2);
}
textarea{
  width:100%;
  min-height:280px;
  background:var(--bg);
  color:var(--text);
  border:none;
  outline:none;
  font-family:var(--mono);
  font-size:1rem;
  line-height:1.6;
  padding:18px;
  resize:vertical;
  tab-size:2;
}
textarea.conflict{ background:#fbeae8; }

/* action groups */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:16px;
}
.branch-bar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:16px;
  min-width:0;
  max-width:100%;
}
.branch-bar select{
  font-family:var(--mono);
  font-size:0.92rem;
  font-weight:600;
  padding:10px 14px;
  border-radius:8px;
  border:1.5px solid var(--accent);
  background:rgba(223,105,26,0.1);
  color:var(--text);
  cursor:pointer;
}
.branch-pill{
  font-family:var(--mono);
  font-size:0.92rem;
  font-weight:600;
  padding:10px 18px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--panel-2);
  color:var(--text-dim);
  cursor:pointer;
}
.branch-pill:hover{ border-color:var(--accent); color:var(--text); }
.branch-pill.active{
  background:rgba(223,105,26,0.16);
  border-color:var(--accent);
  color:var(--text);
}
.branch-pill-add{
  font-size:0.92rem;
  font-weight:700;
  padding:10px 18px;
  border-radius:20px;
  border:1.5px dashed var(--text-dim);
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
}
.branch-pill-add:hover{ border-color:var(--accent); color:var(--accent); }
.new-branch-form{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  min-width:0;
  max-width:100%;
}
.new-branch-form input{
  font-family:var(--mono);
  font-size:0.92rem;
  padding:10px 14px;
  border-radius:20px;
  border:1.5px solid var(--accent);
  background:var(--bg);
  color:var(--text);
  flex:1 1 120px;
  min-width:0;
  max-width:220px;
}
.scenarios-section{
  border:1.5px solid var(--accent);
  border-left:6px solid var(--accent);
  background:rgba(223,105,26,0.05);
  border-radius:12px;
  padding:18px 20px;
  margin-bottom:22px;
}
.scenarios-head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}
.scenarios-head{
  font-weight:700;
  font-size:1.1rem;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:8px;
}
.scenarios-sub{
  font-size:0.85rem;
  color:var(--text-dim);
  margin-top:2px;
}
.scenarios-hint{
  font-size:0.78rem;
  color:var(--text-dim);
  font-weight:500;
}
.scenarios-chevron{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px; height:28px;
  border-radius:50%;
  background:rgba(223,105,26,0.14);
  color:var(--accent);
  font-size:0.85rem;
  font-weight:700;
  transition:transform .15s ease;
  flex-shrink:0;
}
.scenarios-chevron.open{ transform:rotate(90deg); }
.scenario-list{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.scenario-item{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}
.scenario-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  cursor:pointer;
}
.scenario-header:hover{ background:rgba(43,62,80,0.04); }
.scenario-num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px; height:22px;
  border-radius:50%;
  background:var(--accent);
  color:#ffffff;
  font-size:0.75rem;
  font-weight:700;
  flex-shrink:0;
}
.scenario-title{
  font-weight:700;
  font-size:0.9rem;
  color:#2b3e50;
  flex:1;
}
.scenario-arrow{
  font-size:0.8rem;
  color:var(--text-dim);
  transition:transform .15s ease;
  flex-shrink:0;
}
.scenario-arrow.open{ transform:rotate(90deg); }
.scenario-body{
  padding:0 14px 14px 46px;
}
.scenario-pre{
  font-size:0.8rem;
  color:var(--text-dim);
  font-style:italic;
  margin-bottom:8px;
  padding-bottom:8px;
  border-bottom:1px dashed var(--border);
}
.scenario-steps{
  font-size:0.82rem;
  color:var(--text-dim);
  line-height:1.5;
  margin-bottom:10px;
}
.scenario-result{
  font-size:0.8rem;
  line-height:1.45;
  background:rgba(43,62,80,0.08);
  border-left:3px solid var(--green);
  padding:7px 10px;
  border-radius:4px;
  color:var(--text);
}
.scenario-result b{ color:var(--green); }
.action-group{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:9px;
  padding:16px;
}
.group-label{
  font-size:0.78rem;
  color:var(--text-dim);
  margin-bottom:10px;
}
.action-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
.action-row + .action-row{ margin-top:10px; }
.action-row .commit-input, .action-row select, .action-row input[type=text]{
  font-family:var(--mono);
  font-size:0.9rem;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:7px;
  padding:11px 13px;
}
.action-row .commit-input{min-width:180px;flex:1;}

/* terminal sidebar */
.terminal-sidebar{
  position:sticky;
  top:20px;
  height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
  background:#010409;
  border:1.5px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.terminal-sidebar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  flex-shrink:0;
}
.terminal-sidebar-head .t-title{
  font-family:var(--mono);
  font-size:0.82rem;
  color:#2b3e50;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.terminal-sidebar-head .t-title .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.terminal-sidebar-head button.clear-btn{

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Git Simulator</h1>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="reset-link terminal-toggle-btn tip-below" id="terminalToggleBtn" data-tip="Shows a detailed log of exactly what each button does, step by step." onclick="toggleTerminalPanel()">Show terminal</button>
      <button class="reset-link tip-below" data-tip="Clears everything and starts over from a fresh clone." onclick="resetAll()">Reset</button>
    </div>
  </header>

  <div class="scenarios-section" id="scenariosSection"></div>

  <div class="page-layout" id="pageLayout">
    <div id="app"></div>
    <div class="resizer" id="resizer" style="display:none;"></div>
    <div class="terminal-sidebar" id="terminalSidebar" style="display:none;">
      <div class="terminal-sidebar-head">
        <span class="t-title"><span class="dot"></span>Terminal</span>
        <button class="clear-btn tip-below" data-tip="Clears this log's text. Doesn't undo anything in your repository." onclick="clearTerminal()">Clear</button>
      </div>
      <div class="terminal" id="terminal"></div>
    </div>
  </div>
</div>

<script>
/* ================= state ================= */
let cloned = false;
let seq = 0;
const FILE = 'greet.py';
const STARTER = `def greet(name):\n    print(f"Hello, {name}")\n\ngreet("world")\n`;

let commits = {};           // id -> {id, parents:[], branch, message, content, order}
let local = { branches:{}, HEAD:'main', working:'', staged:null };
let remote = { branches:{} };
let pullRequests = []; // {id, source, target, status: 'open'|'merged'|'closed'}
let prSeq = 0;
let showAdvanced = false; // branches & merge tools
let showPRs = false;      // pull request tools
let showTerminal = false; // real git command output
let remoteViewBranch = null; // which branch's file to preview on GitHub; null = follow local.HEAD
let showNewBranchInput = false;

function toggleNewBranchInput(){ showNewBranchInput = !showNewBranchInput; renderApp(true); }

/* ---- scenarios accordion (whole section closed by default; items open one at a time) ---- */
const SCENARIOS = [
  { title:'Save your first change',
    pre:"Let's imagine you have your cloned repository.",
    steps:'1. Edit the code.<br>2. Click Stage.<br>3. Click Commit.',
    result:'"Your computer" shows a new commit in its history. GitHub still shows the old version \u2014 nothing has been sent yet.' },

  { title:'Publish your work to GitHub',
    pre:"Let's imagine you've already committed a change locally.",
    steps:'1. Edit the code.<br>2. Stage, then Commit.<br>3. Click Push.',
    result:"GitHub's file and commit history now match your computer exactly." },

  { title:"Catch up with a teammate's work",
    pre:"Let's imagine your working tree is clean, with no uncommitted changes.",
    steps:'1. Click "Simulate teammate push" (adds a commit to GitHub without your help).<br>2. Click Pull.',
    result:'Their commit is combined into your local history automatically \u2014 no conflict, since you had no local changes.' },

  { title:'Build a feature safely on a branch',
    pre:"Let's imagine you're starting from a clean main branch.",
    steps:'1. Click "+ New branch" and name it.<br>2. Edit the code.<br>3. Stage, then Commit.<br>4. Click Push.',
    result:'main is untouched the whole time. Only your branch \u2014 locally and now on GitHub \u2014 has the new work.' },

  { title:'Bring a finished branch into main',
    pre:"Let's imagine you already have a branch with at least one commit main doesn't have.",
    steps:'1. Make sure your branch has a commit main doesn\u2019t have.<br>2. Scroll down and open "Merge branches".<br>3. Merge your branch into main.',
    result:"main's history now includes the commit(s) from your branch. Your branch still exists, untouched." },

  { title:'Handle a real merge conflict',
    pre:"Let's imagine you're starting with a clean working tree.",
    steps:'1. Edit the greeting line (the one with "Hello") and commit it.<br>2. Click "Simulate teammate push" (it edits that same greeting line).<br>3. Click Pull.<br>4. Fix the &lt;&lt;&lt;&lt;&lt;&lt;&lt; markers in the file, check the box, then Stage + Commit.<br>5. Click Push.',
    result:'GitHub and your computer both end up with one single, agreed-upon version of that line. If you\u2019d edited a different line instead, Git would have merged both changes automatically \u2014 no conflict at all.' },

  { title:'Create a Pull Request',
    pre:"Let's imagine you're starting from a clean main branch.",
    steps:'1. Create a branch, edit the code, commit, then Push it.<br>2. Open a pull request from your branch into main.<br>3. Click "Merge pull request".<br>4. Click Pull on your computer.',
    result:"GitHub's main updates the moment you merge the PR. Your computer only catches up once you Pull." }
];
let scenariosOpen = false;   // whole section collapsed by default
let openScenarioIdx = null;  // which single scenario is expanded

function toggleScenariosSection(){ scenariosOpen = !scenariosOpen; renderScenarios(); }
function toggleScenario(i){ openScenarioIdx = (openScenarioIdx===i) ? null : i; renderScenarios(); }

function renderScenarios(){
  const el = document.getElementById('scenariosSection');
  if(!el) return;
  el.innerHTML = `
    <div class="scenarios-head-row" onclick="toggleScenariosSection()">
      <div>
        <div class="scenarios-head">\u{1F9ED} Try these scenarios</div>
        ${scenariosOpen ? `<div class="scenarios-sub">Simple things to try, and what should happen if it works.</div>` : `<div class="scenarios-hint">7 guided walkthroughs \u2014 click to open</div>`}
      </div>
      <span class="scenarios-chevron ${scenariosOpen?'open':''}">\u25b8</span>
    </div>
    ${scenariosOpen ? `
    <div class="scenario-list">
      ${SCENARIOS.map((s,i) => `
        <div class="scenario-item">
          <div class="scenario-header" onclick="toggleScenario(${i})">
            <span class="scenario-num">${i+1}</span>
            <span class="scenario-title">${s.title}</span>
            <span class="scenario-arrow ${openScenarioIdx===i?'open':''}">\u25b8</span>
          </div>
          ${openScenarioIdx===i ? `
          <div class="scenario-body">
            ${s.pre ? `<div class="scenario-pre">${s.pre}</div>` : ''}
            <div class="scenario-steps">${s.steps}</div>
            <div class="scenario-result"><b>Expected:</b> ${s.result}</div>
          </div>` : ''}
        </div>`).join('')}
    </div>` : ''}
  `;
}

function toggleAdvanced(){ showAdvanced = !showAdvanced; renderApp(true); }
function togglePRs(){ showPRs = !showPRs; renderApp(true); }
function setRemoteViewBranch(b){ remoteViewBranch = b; renderApp(true); }
function toggleTerminalPanel(){
  showTerminal = !showTerminal;
  const sidebar = document.getElementById('terminalSidebar');
  const resizer = document.getElementById('resizer');
  const btn = document.getElementById('terminalToggleBtn');
  if(sidebar) sidebar.style.display = showTerminal ? '' : 'none';
  if(resizer) resizer.style.display = showTerminal ? '' : 'none';
  if(btn) btn.textContent = showTerminal ? 'Hide terminal' : 'Show terminal';
  renderApp(true);
}

function computeGuidance(){
  if(!cloned) return { text: "Start by cloning the project.", tone:'neutral' };
  if(conflict && !conflict.checked) return { text: "You and GitHub both changed the same lines. Edit the file below to fix it, then check the box.", tone:'alert' };
  if(conflict && conflict.checked) return { text: "Looks resolved \u2014 click \"Commit merge\" to finish.", tone:'good' };
  const status = computeStatus();
  const ab = aheadBehind(local.HEAD);
  if(status==='modified') return { text: "You changed the code. Click Stage, then Commit to save it.", tone:'neutral' };
  if(status==='staged') return { text: "Your change is staged. Click Commit to save it for good.", tone:'neutral' };
  if(status==='partial') return { text: "You staged a change, then edited again. Commit will only save the staged snapshot \u2014 click Stage again to include your latest edits too.", tone:'neutral' };
  if(ab==='ahead of origin') return { text: "You have commits GitHub doesn't have yet. Click Push to share them.", tone:'neutral' };
  if(ab==='behind origin') return { text: "GitHub has new commits you don't have. Click Pull to catch up.", tone:'neutral' };
  if(ab==='diverged from origin') return { text: "Your computer and GitHub both moved forward. Click Pull to combine them.", tone:'neutral' };
  if(ab==='not on GitHub yet') return { text: "This branch only exists on your computer. Click Push to put it on GitHub.", tone:'neutral' };
  return { text: "Everything's in sync. Try editing the code.", tone:'good' };
}
let conflict = null;        // {ours, theirs, parents:[a,b], message} while active
let branchColorOf = {};
const PALETTE = ['#df691a','#2b3e50','#8a9bab','#c9884f'];
let paletteIdx = 0;
let term = [];
function clearTerminal(){ term = []; renderTerminal(); }

function newId(){ seq++; return seq.toString().padStart(7,'0'); }
function colorFor(branch){ if(!branchColorOf[branch]){ branchColorOf[branch]=PALETTE[paletteIdx%PALETTE.length]; paletteIdx++; } return branchColorOf[branch]; }

function ensureNL(s){ return s.endsWith('\n') ? s : s + '\n'; }

function toLines(s){
  const lines = ensureNL(s).split('\n');
  if(lines[lines.length-1] === '') lines.pop();
  return lines;
}

/* ---- real 3-way merge (like git): only conflicts when both sides change
   an OVERLAPPING region differently relative to their common ancestor ---- */
function computeOpcodes(a, b){
  const n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, ()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  let i=0,j=0; const ops=[];
  while(i<n && j<m){
    if(a[i]===b[j]){ ops.push({tag:'equal', ai:i, bj:j}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ ops.push({tag:'delete', ai:i}); i++; }
    else { ops.push({tag:'insert', bj:j}); j++; }
  }
  while(i<n){ ops.push({tag:'delete', ai:i}); i++; }
  while(j<m){ ops.push({tag:'insert', bj:j}); j++; }
  return ops;
}
function opsToHunks(ops, b){
  const hunks = [];
  let baseIdx = 0, k = 0;
  while(k < ops.length){
    if(ops[k].tag === 'equal'){ baseIdx++; k++; continue; }
    const hunkBaseStart = baseIdx;
    let bStart=null, bEnd=null;
    while(k<ops.length && ops[k].tag !== 'equal'){
      if(ops[k].tag === 'delete'){ baseIdx++; }
      else { if(bStart===null) bStart = ops[k].bj; bEnd = ops[k].bj+1; }
      k++;
    }
    hunks.push({ baseStart: hunkBaseStart, baseEnd: baseIdx, newLines: bStart===null ? [] : b.slice(bStart,bEnd) });
  }
  return hunks;
}
function diffHunks(base, modified){ return opsToHunks(computeOpcodes(base, modified), modified); }

function renderRegion(baseLines, start, end, hunks){
  const sorted = hunks.slice().sort((a,b)=>a.baseStart-b.baseStart);
  const out = [];
  let cursor = start;
  for(const h of sorted){
    if(h.baseStart > cursor) out.push(...baseLines.slice(cursor, h.baseStart));
    out.push(...h.newLines);
    cursor = Math.max(cursor, h.baseEnd);
  }
  if(cursor < end) out.push(...baseLines.slice(cursor, end));
  return out;
}

function hunksOverlap(aStart,aEnd,bStart,bEnd){
  const aZero = aStart===aEnd, bZero = bStart===bEnd;
  if(!aZero && !bZero) return aStart < bEnd && bStart < aEnd;
  if(aZero && bZero) return aStart===bStart;
  if(aZero) return aStart >= bStart && aStart <= bEnd;
  return bStart >= aStart && bStart <= aEnd;
}

/* Real 3-way merge: clusters any ours/theirs hunks whose base ranges actually
   overlap (regardless of where each hunk starts), not just ones that happen
   to start at the same position \u2014 so an overlapping change starting a line
   or two later than the other side's change is never silently dropped. */
function threeWayMerge(baseLines, oursLines, theirsLines){
  const oursHunks = diffHunks(baseLines, oursLines).map(h=>({...h, side:'ours'}));
  const theirsHunks = diffHunks(baseLines, theirsLines).map(h=>({...h, side:'theirs'}));
  const all = oursHunks.concat(theirsHunks).sort((a,b)=> a.baseStart-b.baseStart || a.baseEnd-b.baseEnd);

  const clusters = [];
  for(const h of all){
    const last = clusters[clusters.length-1];
    if(last && hunksOverlap(h.baseStart, h.baseEnd, last.start, last.end)){
      last.start = Math.min(last.start, h.baseStart);
      last.end = Math.max(last.end, h.baseEnd);
      last.hunks.push(h);
    } else {
      clusters.push({ start:h.baseStart, end:h.baseEnd, hunks:[h] });
    }
  }

  const n = baseLines.length;
  const result = [];
  let cursor = 0, hasConflict = false;

  for(const c of clusters){
    if(c.start > cursor) result.push({type:'lines', lines: baseLines.slice(cursor, c.start)});
    const oursIn = c.hunks.filter(h=>h.side==='ours');
    const theirsIn = c.hunks.filter(h=>h.side==='theirs');
    if(oursIn.length && theirsIn.length){
      const oursSide = renderRegion(baseLines, c.start, c.end, oursIn);
      const theirsSide = renderRegion(baseLines, c.start, c.end, theirsIn);
      if(oursSide.join('\n') === theirsSide.join('\n')){
        result.push({type:'lines', lines: oursSide});
      } else {
        result.push({type:'conflict', ours: oursSide, theirs: theirsSide});
        hasConflict = true;
      }
    } else if(oursIn.length){
      result.push({type:'lines', lines: renderRegion(baseLines, c.start, c.end, oursIn)});
    } else {
      result.push({type:'lines', lines: renderRegion(baseLines, c.start, c.end, theirsIn)});
    }
    cursor = c.end;
  }
  if(cursor < n) result.push({type:'lines', lines: baseLines.slice(cursor, n)});
  return { hasConflict, result };
}

/* Build the working-file text from a merge result: clean lines flow through
   untouched, and only genuinely conflicting hunks get <<<<<<< markers. */
function renderMergeResult(mergeResult, theirsLabel){
  const parts = [];
  mergeResult.result.forEach(chunk=>{
    if(chunk.type==='lines'){
      if(chunk.lines.length) parts.push(chunk.lines.join('\n') + '\n');
    } else {
      parts.push('<<<<<<< HEAD\n');
      if(chunk.ours.length) parts.push(chunk.ours.join('\n') + '\n');
      parts.push('=======\n');
      if(chunk.theirs.length) parts.push(chunk.theirs.join('\n') + '\n');
      parts.push('>>>>>>> ' + theirsLabel + '\n');
    }
  });
  return parts.join('');
}

function ancestorSet(id){
  const seen=new Set(); const stack=[id];
  while(stack.length){ const c=stack.pop(); if(seen.has(c))continue; seen.add(c);
    const co=commits[c]; if(co) co.parents.forEach(p=>stack.push(p)); }
  return seen;
}
function isAncestor(a,b){ return ancestorSet(b).has(a); }
function commonAncestor(a,b){
  const A=ancestorSet(a); let best=null,bo=-1;
  ancestorSet(b).forEach(id=>{ if(A.has(id) && commits[id].order>bo){ best=id; bo=commits[id].order; } });
  return best;
}
function headId(repo,branch){ return repo.branches[branch]; }
function localHeadId(){ return local.branches[local.HEAD]; }

/* ================= terminal log ================= */
function log(type, text){ term.push({type,text}); renderTerminal(); }
function gap(){ term.push({type:'gap'}); }
function renderTerminal(){
  const el = document.getElementById('terminal');
  if(!el) return;
  el.innerHTML = term.map(l => l.type==='gap' ? '<div class="tline gap"></div>' : `<div class="tline ${l.type}">${escapeHtml(l.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ================= status ================= */
function computeStatus(){
  if(conflict && !conflict.resolved) return 'conflict';
  // Real git tracks the index (staged) and working tree as independent states,
  // both compared against HEAD. If nothing has been staged since HEAD,
  // the index is effectively HEAD's content.
  const head = commits[localHeadId()].content;
  const stagedContent = local.staged !== null ? local.staged : head;
  const hasStagedChange = stagedContent !== head;       // index differs from HEAD
  const hasUnstagedChange = local.working !== stagedContent; // working differs from index
  if(!hasStagedChange && !hasUnstagedChange) return 'clean';
  if(hasStagedChange && !hasUnstagedChange) return 'staged';
  if(!hasStagedChange && hasUnstagedChange) return 'modified';
  return 'partial'; // staged AND further edited since \u2014 commit still uses the staged snapshot
}
function aheadBehind(branch){
  const l = local.branches[branch], r = remote.branches[branch];
  if(!r) return 'not on GitHub yet';
  if(l===r) return 'up to date with origin';
  if(isAncestor(r,l)) return 'ahead of origin';
  if(isAncestor(l,r)) return 'behind origin';
  return 'diverged from origin';
}

/* ================= actions ================= */
function doClone(){
  cloned = true;
  const id = newId();
  commits[id] = { id, parents:[], branch:'main', message:'Initial commit', content:STARTER, order:0 };
  local = { branches:{main:id}, HEAD:'main', working:STARTER, staged:null };
  remote = { branches:{main:id} };
  colorFor('main');
  log('cmd','git clone https://github.com/you/project.git');
  log('out',"Cloning into 'project'...", 'Downloading a copy of the project to your computer.');
  log('out','remote: Enumerating objects: 3, done.', '');
  log('out','Receiving objects: 100% (3/3), 620 bytes | 620.00 KiB/s, done.', "Done \u2014 you now have your own copy.");
  gap();
  renderApp();
}

function onEdit(value){
  local.working = value;
  updateStatusIndicators();
}
function updateStatusIndicators(){
  const status = computeStatus();
  const labelMap = {clean:'clean',modified:'modified',staged:'staged',partial:'staged + modified',conflict:'conflict'};
  const badge = document.querySelector('.badge');
  if(badge){ badge.className = 'badge '+status; badge.textContent = labelMap[status]; }
  const syncNote = document.querySelector('.sync-note');
  if(syncNote){ syncNote.textContent = aheadBehind(local.HEAD); }
}
function handleEditorTab(e, el){
  if(e.key === 'Tab'){
    e.preventDefault();
    const start = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.substring(0,start) + '    ' + el.value.substring(end);
    el.selectionStart = el.selectionEnd = start + 4;
    onEdit(el.value);
  }
}

function toggleResolveCheck(checked){
  if(!conflict) return;
  conflict.checked = checked;
  renderApp(true);
}

function doStage(){
  const status = computeStatus();
  if(conflict){
    if(!conflict.checked){
      log('cmd','git add '+FILE);
      log('error', 'Check "I\'ve resolved the conflict" above before staging.', 'Check the box above first, then try again.');
      return;
    }
    if(local.working.includes('<<<<<<<') || local.working.includes('=======') || local.working.includes('>>>>>>>')){
      log('cmd','git add '+FILE);
      log('error','error: '+FILE+' still contains unresolved conflict markers (<<<<<<<). Remove them before staging.', 'Your file still has <<<<<<< or ======= marks in it \u2014 remove them first.');
      return;
    }
    local.staged = local.working;
    conflict.resolved = true;
    log('cmd','git add '+FILE);
    log('out','(conflict markers removed \u2014 file marked as resolved)', 'Nice \u2014 your file looks clean. It\'s ready to commit.');
    renderApp(); return;
  }
  if(status==='clean'){ log('cmd','git add '+FILE); log('out','nothing to add, working tree clean', "There's nothing new to save \u2014 you haven't changed anything."); return; }
  local.staged = local.working;
  log('cmd','git add '+FILE);
  renderApp();
}

function doCommit(message){
  if(conflict && !conflict.resolved){
    log('cmd', `git commit -m "${message||'update'}"`);
    log('error', 'error: Committing is not possible because you have unmerged files.', 'Finish resolving the conflict before you can commit.');
    log('warn', "hint: Fix them up in the work tree, and then use 'git add' to mark resolution.", '');
    gap(); return;
  }
  const status = computeStatus();
  if(status==='clean'){ log('cmd',`git commit -m "${message||'update'}"`); log('out','nothing to commit, working tree clean', "There's nothing to commit \u2014 you haven't staged any changes."); return; }
  if(status==='modified'){ log('cmd',`git commit -m "${message||'update'}"`); log('error','no changes added to commit (use "git add" first)', "You have changes, but haven't staged them yet \u2014 click Stage first."); return; }
  // status is 'staged' or 'partial' \u2014 either way, commit uses local.staged, not local.working
  const msg = message && message.trim() ? message.trim() : (conflict ? conflict.message : `Update ${FILE}`);
  const id = newId();
  const parents = conflict ? conflict.parents : [localHeadId()];
  commits[id] = { id, parents, branch: local.HEAD, message: msg, content: local.staged, order: seq };
  local.branches[local.HEAD] = id;
  local.staged = null;
  const wasMerge = !!conflict;
  conflict = null;
  log('cmd',`git commit -m "${msg}"`);
  log('success', `[${local.HEAD} ${id}] ${msg}`, wasMerge ? 'Merge commit saved on your computer.' : 'Saved a new commit on your computer.');
  log('out', ' 1 file changed, 1 insertion(+), 1 deletion(-)', '');
  if(wasMerge) log('out', 'Merge finished.', '');
  gap();
  renderApp();
}

function doPush(){
  const branch = local.HEAD;
  const lh = local.branches[branch], rh = remote.branches[branch];
  log('cmd', rh ? `git push origin ${branch}` : `git push -u origin ${branch}`);
  if(!rh){
    remote.branches[branch] = lh;
    log('success', `* [new branch]      ${branch} -> ${branch}`, `Created "${branch}" on GitHub and uploaded your commits.`);
    log('out', `Branch '${branch}' set up to track remote branch '${branch}' from 'origin'.`, '');
    gap(); renderApp(); return;
  }
  if(rh===lh){ log('out','Everything up-to-date', 'GitHub already has everything \u2014 nothing to send.'); return; }
  if(isAncestor(rh, lh)){
    remote.branches[branch] = lh;
    log('out', `Enumerating objects: done.`, '');
    log('success', `${rh.slice(0,7)}..${lh.slice(0,7)}  ${branch} -> ${branch}`, 'Sent your commits to GitHub \u2014 it now matches your computer.');
    gap(); renderApp(); return;
  }
  log('error', ' ! [rejected]        '+branch+' -> '+branch+' (fetch first)', 'GitHub refused the push.');
  log('error', "error: failed to push some refs to 'github.com:you/project.git'", '');
  log('warn', 'hint: Updates were rejected because the remote contains work that you do not\nhint: have locally. Integrate those changes (e.g. "git pull") before pushing again.', "GitHub has commits you don't have yet \u2014 pull first, then push again.");
  gap();
}

function doPull(){
  const branch = local.HEAD;
  const status = computeStatus();
  log('cmd', `git pull origin ${branch}`);
  if(status!=='clean'){
    log('error', `error: Your local changes to the following files would be overwritten by merge:`, 'You have uncommitted changes. Commit them before pulling \u2014 staging alone isn\u2019t enough, your working tree needs to be clean.');
    log('error', `\t${FILE}`, '');
    log('warn', 'hint: Please commit your changes before you merge.', '');
    gap(); return;
  }
  const lh = local.branches[branch], rh = remote.branches[branch];
  if(!rh){ log('error', `fatal: couldn't find remote ref ${branch}`, "That branch doesn't exist on GitHub yet."); gap(); return; }
  if(lh===rh){ log('out','Already up to date.', 'You already have everything from GitHub.'); return; }
  if(isAncestor(rh, lh)){ log('out','Already up to date.', "You're already ahead of GitHub \u2014 there's nothing new to bring in. Push to share your commits."); return; }
  if(isAncestor(lh, rh)){
    local.branches[branch] = rh;
    local.working = commits[rh].content; local.staged=null;
    log('out', `Updating ${lh.slice(0,7)}..${rh.slice(0,7)}`, '');
    log('success', 'Fast-forward', 'Your computer moved forward to match GitHub \u2014 no conflicts.');
    log('out', ` ${FILE} | 2 +-`, '');
    gap(); renderApp(); return;
  }
  // diverged: run a real 3-way merge against the common ancestor
  const base = commonAncestor(lh, rh);
  const oursContent = commits[lh].content, theirsContent = commits[rh].content;
  if(oursContent === theirsContent){
    const id = newId();
    commits[id] = { id, parents:[lh, rh], branch, message:`Merge remote-tracking branch 'origin/${branch}'`, content:oursContent, order:seq };
    local.branches[branch]=id;
    local.working = oursContent;
    local.staged = null;
    log('out', "Merge made by the 'ort' strategy.", "Combined GitHub's changes with yours automatically \u2014 no conflicts.");
    gap(); renderApp(); return;
  }
  const merge = threeWayMerge(toLines(commits[base].content), toLines(oursContent), toLines(theirsContent));
  if(!merge.hasConflict){
    const mergedContent = renderMergeResult(merge, `origin/${branch}`);
    const id = newId();
    commits[id] = { id, parents:[lh, rh], branch, message:`Merge remote-tracking branch 'origin/${branch}'`, content:mergedContent, order:seq };
    local.branches[branch]=id;
    local.working = mergedContent;
    local.staged = null;
    log('out', "Merge made by the 'ort' strategy.", "You and GitHub changed different parts of the file, so Git combined both sets of changes automatically \u2014 no conflict.");
    gap(); renderApp(); return;
  }
  local.working = renderMergeResult(merge, `origin/${branch}`);
  conflict = { parents:[lh, rh], message:`Merge remote-tracking branch 'origin/${branch}'`, checked:false };
  log('warn', `Auto-merging ${FILE}`, '');
  log('error', `CONFLICT (content): Merge conflict in ${FILE}`, 'You and GitHub both changed the same lines \u2014 that\'s a conflict.');
  log('error', 'Automatic merge failed; fix conflicts and then commit the result.', 'Edit the file below to fix it, then stage and commit.');
  gap(); renderApp();
}

function doNewBranch(name){
  name = (name||'').trim();
  if(!name) return;
  if(local.branches[name]){ log('cmd', `git checkout -b ${name}`); log('error', `fatal: a branch named '${name}' already exists`); return; }
  colorFor(name);
  local.branches[name] = localHeadId();
  local.HEAD = name;
  showNewBranchInput = false;
  log('cmd', `git checkout -b ${name}`);
  log('success', `Switched to a new branch '${name}'`);
  gap(); renderApp();
}

function doSwitchBranch(name){
  if(!name || name===local.HEAD) return;
  const status = computeStatus();
  log('cmd', `git checkout ${name}`);
  if(status==='conflict'){
    log('error','error: you have unmerged paths; fix conflicts and commit the result before switching.', 'Finish resolving the conflict before switching branches.');
    return;
  }
  const targetContent = commits[local.branches[name]].content;
  if(status==='clean'){
    local.HEAD = name;
    local.working = targetContent;
    local.staged = null;
    log('success', `Switched to branch '${name}'`);
    gap(); renderApp();
    return;
  }
  // Plain `git checkout <branch>` does NOT attempt a merge. It only succeeds
  // with uncommitted changes if the file is byte-for-byte identical between
  // your current HEAD and the target branch; otherwise it refuses outright,
  // regardless of whether your edit actually overlaps with what differs.
  // (That smarter carry-over behavior is what `git checkout -m` adds \u2014
  // not modeled here, since the button doesn't claim to run that command.)
  const currentHeadContent = commits[localHeadId()].content;
  if(currentHeadContent === targetContent){
    local.HEAD = name;
    log('success', `Switched to branch '${name}'`, `Your uncommitted changes came with you \u2014 "${name}" had the exact same file, so there was nothing to overwrite.`);
    gap(); renderApp();
    return;
  }
  log('error', `error: Your local changes to the following files would be overwritten by checkout:`, `"${name}" has a different version of this file than what you started from. Commit or discard your changes first.`);
  log('error', `\t${FILE}`, '');
  log('warn', 'hint: Please commit your changes or stash them before you switch branches.', '');
}

function doMerge(source){
  if(!source || source===local.HEAD) return;
  const target = local.HEAD;
  const status = computeStatus();
  log('cmd', `git merge ${source}`);
  if(status!=='clean'){
    log('error', `error: Your local changes to the following files would be overwritten by merge:`, 'You have uncommitted changes. Commit them before merging \u2014 make sure your working tree is clean.');
    log('error', `\t${FILE}`, '');
    log('warn', 'hint: Please commit your changes before you merge.', '');
    return;
  }
  const th = local.branches[target], sh = local.branches[source];
  if(isAncestor(sh, th)){ log('out', `Already up to date.`); return; }
  if(isAncestor(th, sh)){
    local.branches[target] = sh;
    local.working = commits[sh].content;
    local.staged = null;
    log('out', `Updating ${th.slice(0,7)}..${sh.slice(0,7)}`);
    log('success', 'Fast-forward', 'Nothing to merge \u2014 Git just moved the pointer forward. No conflicts.');
    gap(); renderApp(); return;
  }
  const oursContent = commits[th].content, theirsContent = commits[sh].content;
  if(oursContent === theirsContent){
    const id = newId();
    commits[id] = { id, parents:[th, sh], branch:target, message:`Merge branch '${source}' into ${target}`, content:oursContent, order:seq };
    local.branches[target] = id;
    local.working = oursContent;
    local.staged = null;
    log('out', "Merge made by the 'ort' strategy.", "Both branches ended up with the same content \u2014 no conflict.");
    gap(); renderApp(); return;
  }
  const base = commonAncestor(th, sh);
  const merge = threeWayMerge(toLines(commits[base].content), toLines(oursContent), toLines(theirsContent));
  if(!merge.hasConflict){
    const mergedContent = renderMergeResult(merge, source);
    const id = newId();
    commits[id] = { id, parents:[th, sh], branch:target, message:`Merge branch '${source}' into ${target}`, content:mergedContent, order:seq };
    local.branches[target] = id;
    local.working = mergedContent;
    local.staged = null;
    log('out', "Merge made by the 'ort' strategy.", "The two branches changed different parts of the file, so Git combined both automatically \u2014 no conflict.");
    gap(); renderApp(); return;
  }
  local.working = renderMergeResult(merge, source);
  conflict = { parents:[th, sh], message:`Merge branch '${source}' into ${target}`, checked:false };
  log('warn', `Auto-merging ${FILE}`, '');
  log('error', `CONFLICT (content): Merge conflict in ${FILE}`, 'Both branches changed the same lines \u2014 that\'s a conflict.');
  log('error', 'Automatic merge failed; fix conflicts and then commit the result.', 'Edit the file below to fix it, then stage and commit.');
  gap(); renderApp();
}

function doMergeBetween(source, target){
  if(!source || !target || source===target) return;
  if(target !== local.HEAD){
    doSwitchBranch(target);
    if(local.HEAD !== target) return; // switch was blocked; doSwitchBranch already logged why
  }
  doMerge(source);
}

function doAbortMerge(){
  if(!conflict) return;
  local.working = commits[localHeadId()].content;
  local.staged = null;
  conflict = null;
  log('cmd', 'git merge --abort');
  gap(); renderApp();
}

function doTeammatePush(){
  const branch = 'main';
  const rh = remote.branches[branch];
  const base = commits[rh].content;
  const lines = toLines(base);
  const idx = lines.findIndex(l => l.includes('print(f"Hello'));
  if(idx !== -1){
    lines[idx] = lines[idx].replace('Hello', 'Hey there');
  } else {
    lines.push('# tweak from a teammate');
  }
  const edited = lines.join('\n') + '\n';
  const id = newId();
  commits[id] = { id, parents:[rh], branch, message:'Tweak greeting text', content: edited, order:seq };
  remote.branches[branch] = id;
  log('notice', "\u2022 A teammate just pushed a new commit to GitHub (main) \u2014 it changes the greeting line. Your computer doesn't know yet.");
  gap(); renderApp();
}

/* ---- pull requests ---- */
function doOpenPR(source, target){
  if(!source || !target || source===target) return;
  if(!remote.branches[source]){ log('error', `Can't open a pull request \u2014 "${source}" hasn't been pushed to GitHub yet.`); gap(); return; }
  if(!remote.branches[target]){ log('error', `Can't open a pull request \u2014 "${target}" doesn't exist on GitHub.`); gap(); return; }
  if(pullRequests.some(pr => pr.status==='open' && pr.source===source && pr.target===target)){
    log('error', `There's already an open pull request from "${source}" into "${target}".`); gap(); return;
  }
  prSeq++;
  pullRequests.push({ id: prSeq, source, target, status:'open' });
  log('github', `\u2601 Opened pull request #${prSeq} on GitHub: ${source} \u2192 ${target}`);
  gap(); renderApp();
}

function prMergeability(pr){
  const sh = remote.branches[pr.source], th = remote.branches[pr.target];
  if(sh===th) return { mergeable:false, reason:'uptodate' };
  if(isAncestor(sh, th)) return { mergeable:false, reason:'uptodate' };
  if(isAncestor(th, sh)) return { mergeable:true, fastforward:true };
  if(commits[th].content === commits[sh].content) return { mergeable:true, fastforward:false };
  const base = commonAncestor(th, sh);
  const merge = threeWayMerge(toLines(commits[base].content), toLines(commits[th].content), toLines(commits[sh].content));
  if(merge.hasConflict) return { mergeable:false, reason:'conflict' };
  return { mergeable:true, fastforward:false, mergedContent: renderMergeResult(merge, pr.source) };
}

function doMergePR(prId){
  const pr = pullRequests.find(p => p.id===prId);
  if(!pr || pr.status!=='open') return;
  const check = prMergeability(pr);
  if(!check.mergeable){
    if(check.reason==='conflict'){
      log('github', `\u2601 GitHub can't automatically merge pull request #${pr.id} \u2014 "${pr.source}" and "${pr.target}" both changed the same lines.`);
      log('github', `Fix it locally: switch to "${pr.source}", merge "${pr.target}" into it, resolve the conflict, commit, then push "${pr.source}" again.`);
    } else {
      log('github', `Pull request #${pr.id} is already up to date \u2014 nothing to merge.`);
    }
    gap(); return;
  }
  const sh = remote.branches[pr.source], th = remote.branches[pr.target];
  const content = check.mergedContent !== undefined ? check.mergedContent : commits[sh].content;
  const id = newId();
  commits[id] = { id, parents:[th, sh], branch: pr.target, message:`Merge pull request #${pr.id} from ${pr.source}`, content, order:seq };
  remote.branches[pr.target] = id;
  pr.status = 'merged';
  log('github', `\u2601 Merged pull request #${pr.id} on GitHub: ${pr.source} \u2192 ${pr.target}`, `\u2601 Merged pull request #${pr.id} \u2014 GitHub always makes a merge commit here, even when a fast-forward was possible.`);
  log('notice', `Your computer doesn't have this yet \u2014 pull "${pr.target}" to catch up.`);
  gap(); renderApp();
}

function doClosePR(prId){
  const pr = pullRequests.find(p => p.id===prId);
  if(!pr || pr.status!=='open') return;
  pr.status = 'closed';
  log('github', `\u2601 Closed pull request #${pr.id} without merging.`);
  gap(); renderApp();
}

function resetAll(){
  cloned=false; seq=0; commits={}; local={branches:{},HEAD:'main',working:'',staged:null};
  remote={branches:{}}; conflict=null; branchColorOf={}; paletteIdx=0; term=[];
  pullRequests=[]; prSeq=0; remoteViewBranch=null; showNewBranchInput=false;
  renderApp();
}

/* ================= graph rendering ================= */
function renderGraph(repo){
  const ids = Object.keys(commits).filter(id => Object.values(repo.branches).some(h => ancestorSet(h).has(id)));
  const rows = ids.map(id=>commits[id]).sort((a,b)=>a.order-b.order);
  // lanes are based on commits that actually exist, not every branch name (avoids empty floating lanes)
  const lanes = Object.keys(branchColorOf).filter(b => rows.some(r=>r.branch===b));
  const laneX = b => 26 + lanes.indexOf(b)*90;
  const width = Math.max(200, lanes.length*90+40);
  const height = 34 + rows.length*40 + 10;
  let y={}; rows.forEach((c,i)=>{ y[c.id]=24+i*40; });
  let paths='', nodes='', labels='';
  rows.forEach(c=>{
    c.parents.forEach(p=>{
      if(y[p]===undefined) return;
      const x1=laneX(c.branch), y1=y[c.id], x2=laneX(commits[p].branch), y2=y[p];
      paths += `<path d="M ${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}" stroke="${branchColorOf[c.branch]||'#888'}" stroke-width="2" fill="none" opacity="0.8"/>`;
    });
  });
  rows.forEach(c=>{
    const cx=laneX(c.branch), cy=y[c.id];
    nodes += `<circle cx="${cx}" cy="${cy}" r="6" fill="${branchColorOf[c.branch]||'#888'}" stroke="#f7f8fa" stroke-width="1.5"/>`;
  });
  // group branch pointers by the lane of the commit they point to, so branches
  // that haven't diverged yet (share a commit) show together, not as empty lanes
  const laneLabels = {};
  Object.keys(repo.branches).forEach(b=>{
    const hid = repo.branches[b];
    const commit = commits[hid];
    if(!commit || y[hid]===undefined) return;
    const lane = commit.branch;
    if(!lanes.includes(lane)) return;
    if(!laneLabels[lane]) laneLabels[lane] = [];
    if(!laneLabels[lane].includes(b)) laneLabels[lane].push(b);
  });
  Object.keys(laneLabels).forEach(lane=>{
    const cx = laneX(lane);
    const text = laneLabels[lane].join(' / ');
    labels += `<text x="${cx}" y="14" text-anchor="middle" font-size="9.5" font-weight="600" fill="${branchColorOf[lane]||'#888'}">${text}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" height="${height}">${paths}${nodes}${labels}</svg>`;
}

          <div class="section-body">
          <div class="pr-list">
            ${pullRequests.length===0 ? '' : pullRequests.slice().reverse().map(pr => `
              <div class="pr-card ${pr.status}">
                <div class="pr-top">
                  <span class="pr-title">#${pr.id} ${pr.source} \u2192 ${pr.target}</span>
                  <span class="pr-status ${pr.status}">${pr.status}</span>
                </div>
                ${pr.status==='open' ? `
                <div class="pr-actions">
                  <button class="primary" data-tip="Combines this branch into the target, on GitHub's server \u2014 not on your computer." onclick="doMergePR(${pr.id})">Merge pull request</button>
                  <button class="ghost" data-tip="Closes this pull request without merging it." onclick="doClosePR(${pr.id})">Close</button>
                </div>` : ''}
              </div>`).join('')}
          </div>
          ${pullRequests.length===0 ? '<div class="pr-empty">No pull requests yet.</div>' : ''}

          ${remoteBranchNames.length>1 ? `
          <div class="action-row">
            <select id="prSource">${remoteBranchNames.map(b=>`<option value="${b}" ${b===(remoteBranchNames.find(x=>x!==local.HEAD)||remoteBranchNames[0])?'selected':''}>${b}</option>`).join('')}</select>
            <span style="font-size:0.78rem;color:var(--text-dim);">into</span>
            <select id="prTarget">${remoteBranchNames.map(b=>`<option value="${b}" ${b==='main'?'selected':''}>${b}</option>`).join('')}</select>
            <button data-tip="Opens a pull request on GitHub comparing these two pushed branches." onclick="doOpenPR(document.getElementById('prSource').value, document.getElementById('prTarget').value)">Open pull request</button>
          </div>` : `<div class="pr-note">Push a second branch to GitHub to open a pull request.</div>`}
          </div>` : ''}
        </div>

        <div class="graph-panel" style="background:transparent;border:none;padding:0;">
          <div class="label">History</div>
          ${renderGraph(remote)}
        </div>
      </div>

    </div>
  `;
  renderTerminal();
  if(!preserveScroll){
    const ta = document.getElementById('editor');
    if(ta) ta.scrollTop = 0;
  }
}

function initResizer(){
  const resizer = document.getElementById('resizer');
  const sidebar = document.getElementById('terminalSidebar');
  const layout = document.getElementById('pageLayout');
  if(!resizer || !sidebar || !layout) return;
  let dragging = false;

  function setWidthFromClientX(clientX){
    const rect = layout.getBoundingClientRect();
    let newWidth = rect.right - clientX;
    newWidth = Math.min(640, Math.max(240, newWidth));
    sidebar.style.width = newWidth + 'px';
  }
  function start(){ dragging = true; resizer.classList.add('active'); document.body.style.userSelect = 'none'; }
  function stop(){ dragging = false; resizer.classList.remove('active'); document.body.style.userSelect = ''; }

  resizer.addEventListener('mousedown', start);
  window.addEventListener('mousemove', e => { if(dragging) setWidthFromClientX(e.clientX); });
  window.addEventListener('mouseup', stop);

  resizer.addEventListener('touchstart', start, {passive:true});
  window.addEventListener('touchmove', e => { if(dragging && e.touches[0]) setWidthFromClientX(e.touches[0].clientX); }, {passive:true});
  window.addEventListener('touchend', stop);
}

renderApp();
initResizer();
renderScenarios();
</script>
